version: '3.1'

services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: bdt
      POSTGRES_USER: bdt
      POSTGRES_PASSWORD: bdt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: big-data-team
      MINIO_ROOT_PASSWORD: big-data-team
      MINIO_SERVER_URL: "http://localhost:9000"
      MINIO_BROWSER_REDIRECT_URL: "http://localhost:9001"
    volumes:
      - minio_data:/data
    command: server --console-address ':9001' /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 10s
      retries: 5

  init-minio:
    image: minio/mc
    entrypoint: >
      /bin/sh -c "
      mc alias set dm http://minio:9000 big-data-team big-data-team;
      if ! mc ls dm/big-data-team; then
        mc mb dm/big-data-team
      fi;
      echo ""Bucket setup complete."";
      exit 0;
      "
    depends_on:
      minio:
        condition: service_healthy

  devcontainer:
    build:
      context: ./spark
      dockerfile: Dockerfile
    volumes:
      - .:/workspace
    command: sleep infinity
    depends_on:
      - postgres
      - minio
      - init-minio
volumes:
  postgres_data:
  minio_data:
